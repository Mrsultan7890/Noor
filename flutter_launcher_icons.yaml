flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/noor_emerald_arch.png"
  adaptive_icon_background: "#0B221B"
  
  # Android specific
  android_min_sdk_version: 21
  
  # iOS specific
  ios_content_mode: "scaleAspectFit"
  
  # Web
  web:
    generate: true
    image_path: "assets/icons/noor_emerald_arch.png"
    background_color: "#0B221B"
    theme_color: "#D4AF37"
  
  # Windows
  windows:
    generate: true
    image_path: "assets/icons/noor_emerald_arch.png"
    icon_size: 48
  
  # macOS
  macos:
    generate: true
    image_path: "assets/icons/noor_emerald_arch.png"
